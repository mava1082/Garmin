# Cloudflare Worker for FORM. Deployed by .github/workflows/form-deploy.yml,
# which fills in database_id. Secrets are set with `wrangler secret put` and never stored here.
name = "form"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "form-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
GITHUB_REF = "claude/compassionate-gauss-am2zpa"
SYNC_WORKFLOW = "form-sync.yml"
